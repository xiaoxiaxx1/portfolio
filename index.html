<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4fc3d9">
<title>夏楚楚 · UI 设计作品集</title>
<style>
/* SECTION: tokens */
:root{
  --deck:#F4F3F0; --fg:#0E1011; --muted:rgba(14,16,17,.62);
  --card:#ffffff; --line:rgba(14,16,17,.10); --accent:#007AFF;
  --shadow:-12px 16px 26px rgba(20,40,50,.14),-2px 3px 6px rgba(20,40,50,.10);
  --tray:rgba(255,255,255,.82);
}
:root[data-theme="night"]{
  --deck:#414348; --fg:#FFFFFF; --muted:rgba(255,255,255,.62);
  --card:#2b2d31; --line:rgba(255,255,255,.10); --accent:#4DA3FF;
  --shadow:-12px 16px 26px rgba(0,0,0,.42),-2px 3px 6px rgba(0,0,0,.30);
  --tray:rgba(43,45,49,.82);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:var(--deck); color:var(--fg); overflow-x:hidden;
  -webkit-font-smoothing:antialiased; transition:background .6s,color .6s;
}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}

/* SECTION: water canvas */
#sea{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(#45c4dd,#0a6a99)}
#sea img{width:100%;height:100%;object-fit:cover;animation:kenburns 40s ease-in-out infinite alternate;transition:filter .8s}
@keyframes kenburns{from{transform:scale(1.03) translate(0,0)}to{transform:scale(1.13) translate(-1.6%,-1.8%)}}
:root[data-theme="night"] #sea img{filter:brightness(.42) saturate(.6) hue-rotate(-8deg)}
#water{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block}

/* SECTION: ui shell */
.ui{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:18px clamp(16px,3vw,32px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:.02em}
.logo svg{width:30px;height:19px;fill:var(--fg);transition:fill .6s}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.tbtn{width:44px;height:44px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  background:var(--tray);backdrop-filter:blur(8px);border:1px solid var(--line);transition:transform .2s}
.tbtn:hover{transform:scale(1.06)}
.tbtn svg{width:20px;height:20px;fill:none;stroke:var(--fg);stroke-width:1.8;stroke-linecap:round}
:root[data-theme="night"] .ic-moon{display:none}
:root[data-theme="day"] .ic-sun{display:none}

/* SECTION: pool */
.pool{flex:1;position:relative;padding:0 clamp(16px,3vw,32px) 24px;min-height:0}
.hero-copy{text-align:center;padding:clamp(8px,3vh,34px) 0 clamp(10px,2vh,20px);position:relative;z-index:3;pointer-events:none}
/* 标题组：素材图片按参考图排版（大英文居中 + 小中文署名），逐词逐字动效 */
.title-group{display:flex;flex-direction:column;align-items:center;gap:clamp(2px,.8vh,8px)}
.tline{display:flex;align-items:flex-end;justify-content:center}
.tline-en{gap:clamp(12px,2vw,30px)}
.tline-cn{gap:clamp(2px,.5vw,6px);margin-top:clamp(6px,1.8vh,16px)}
.tword,.tchar{display:inline-block;line-height:0;animation:tin .85s cubic-bezier(.2,.8,.25,1) both}
.tword img,.tchar img{display:block;animation:bobf 3.6s ease-in-out infinite alternate,glint 5.4s ease-in-out infinite}
.tline-en img{height:clamp(34px,7vw,92px);width:auto}
.tline-cn img{height:clamp(17px,3vw,38px);width:auto}
:root[data-theme="night"] .title-group{filter:brightness(4.2) saturate(1.05)}
@keyframes tin{from{opacity:0;transform:translateY(38px) scale(.86)}to{opacity:1;transform:none}}
@keyframes bobf{from{transform:translateY(-4px) rotate(-1deg)}to{transform:translateY(5px) rotate(1.1deg)}}
@keyframes glint{0%,58%,100%{filter:brightness(1)}70%{filter:brightness(1.5) drop-shadow(0 0 7px rgba(255,255,255,.7))}}
.hero-hint{display:inline-block;margin-top:14px;font-size:12.5px;color:var(--muted);
  border:1px dashed var(--line);border-radius:99px;padding:6px 16px;background:var(--tray)}
.floaters{position:relative;z-index:2;height:clamp(430px,56vh,560px);max-width:1100px;margin:0 auto}
@media(max-width:900px){.floaters{height:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}}

/* SECTION: floater */
.fl{position:absolute;will-change:transform}
@media(max-width:900px){.fl{position:static!important;transform:none!important;width:100%}}
.fl-btn{display:block;width:100%;text-align:left;transition:filter .25s}
.fl-btn:hover{filter:brightness(1.05)}
.tray{background:var(--tray);backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:18px;padding:10px;box-shadow:var(--shadow);transition:box-shadow .3s,transform .35s cubic-bezier(.2,.8,.25,1)}
.fl-btn:hover .tray{box-shadow:var(--shadow),0 0 0 2px var(--accent),0 22px 40px rgba(6,70,105,.28);transform:translateY(-8px) scale(1.03) rotate(0deg)}
.tray .thumb{aspect-ratio:4/3;border-radius:11px;overflow:hidden;background:linear-gradient(135deg,#dfe9ee,#eee6dc);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top center}
.thumb .fail{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.thumb.nofail img{display:none}
.thumb.nofail .fail{display:flex}
.cap{padding:9px 4px 2px}
.cap b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--tray);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:99px;
  padding:12px 22px;box-shadow:var(--shadow);font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap;
  transition:transform .35s cubic-bezier(.2,.8,.25,1),box-shadow .3s}
.fl-btn:hover .pill{transform:translateY(-6px) scale(1.05);box-shadow:var(--shadow),0 0 0 2px var(--accent)}
.pill .em{font-size:16px}
@media(max-width:900px){.pill{justify-content:center}}

/* SECTION: footer strip */
.foot{position:relative;z-index:2;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;
  padding:14px 20px 22px;font-size:12.5px;color:var(--muted)}
.foot a:hover{color:var(--accent)}

/* SECTION: card modal */
.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.open{display:block}
.modal-mask{position:absolute;inset:0;background:rgba(10,12,14,.55);backdrop-filter:blur(6px);opacity:0;transition:opacity .4s ease}
.modal.open.mask-in .modal-mask{opacity:1}
.modal-panel{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:clamp(12px,3vh,36px) 16px 60px}
.card{max-width:760px;margin:0 auto;background:var(--card);border-radius:24px;overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.4)}
.card.flip{transition:transform .5s cubic-bezier(.22,.9,.24,1),opacity .35s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
.card:not(.flip){animation:cardIn .35s ease}
/* 简历按钮（关于我） */
.resume-row{display:flex;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.resume-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:14px;
  background:var(--accent);color:#fff;font-size:14px;font-weight:700;text-decoration:none;
  box-shadow:0 8px 22px rgba(0,122,255,.32);transition:transform .25s cubic-bezier(.2,.8,.25,1),box-shadow .25s}
.resume-btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 12px 28px rgba(0,122,255,.4)}
.resume-btn svg{width:17px;height:17px}
.card-head{padding:26px 28px 20px;position:relative}
.card-x{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;
  background:var(--line);font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.card-x:hover{background:var(--accent);color:#fff}
.card-head h3{font-size:clamp(20px,3.4vw,26px);font-weight:800;padding-right:44px}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fact{font-size:12px;font-weight:600;padding:6px 13px;border-radius:99px;background:var(--line);color:var(--fg)}
.fact.acc{background:var(--accent);color:#fff}
.card-text{padding:0 28px 20px;font-size:14px;color:var(--muted);line-height:1.75}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:0 28px 24px}
.tool{font-size:12px;font-weight:700;padding:6px 13px;border-radius:10px;border:1px solid var(--line)}
/* 静态内容卡（关于/经历/联系） */
.card-static{padding:4px 28px 28px;font-size:14px;line-height:1.8;color:var(--muted)}
.card-static h4{font-size:15px;font-weight:800;color:var(--fg);margin:18px 0 8px}
.card-static p{margin-bottom:8px}
.card-static b{color:var(--fg)}
.card-static .row{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.card-static .row .k{flex:none;width:76px;color:var(--muted)}
.card-static .row .v{font-weight:600;color:var(--fg);min-width:0;word-break:break-all}
.card-static .tl{border-left:2px solid var(--line);padding-left:16px;margin:10px 0 18px}
.card-static .tl .t{font-size:12px;font-weight:700;color:var(--accent)}
.card-static .tl .r{font-weight:800;color:var(--fg);font-size:14.5px;margin:2px 0}
.board{background:#fff}
.board img{width:100%;height:auto;cursor:zoom-in;
  opacity:0;transform:translateY(36px) scale(.985);
  transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.25,1);
  min-height:150px;background:linear-gradient(100deg,#e9f1f5 30%,#f7fbfd 50%,#e9f1f5 70%);
  background-size:220% 100%;animation:shimmer 1.3s linear infinite}
.board img.in{opacity:1;transform:none;animation:none;background:#fff;min-height:0}
@keyframes shimmer{from{background-position:220% 0}to{background-position:-220% 0}}
.board .tile-fail{display:none;padding:70px 20px;text-align:center;color:#777;
  background:linear-gradient(135deg,#eef3f6,#f6f0e8);font-size:14px}
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(8,10,12,.93);display:none;align-items:center;justify-content:center;padding:16px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
/* 长图（作品集分段）模式：按原始宽度滚动浏览，像看 PDF */
.lightbox.tall{display:block;overflow-y:auto;padding:0}
.lightbox.tall img{width:100%;max-width:1100px;margin:0 auto;display:block;border-radius:0;object-fit:none;max-height:none}
.lightbox .lb-tip{display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:201;
  font-size:12.5px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.55);border-radius:99px;padding:7px 18px;pointer-events:none}
.lightbox.tall .lb-tip{display:block}

/* SECTION: reduced motion */
@media(prefers-reduced-motion:reduce){.card,.card.flip,.tword,.tchar,.tword img,.tchar img{animation:none;transition:none}}
</style>
</head>

(function buildTitle(){
  /* 词内降部比例（如 My 的 y 尾巴），用于 flex-end 下的基线对齐 */
  function line(el, arr, cls, baseOff, ent, bob, gl){
    arr.forEach(function(src, i){
      var sp = document.createElement("span");
      sp.className = cls;
      sp.style.animationDelay = (i * ent) + "s";
      var img = document.createElement("img");
      img.src = "data:image/png;base64," + src;
      img.alt = i === 0 && el.id === "tl0" ? "Welcome To My Portfolio" : "";
      img.style.animationDelay = (-i * bob) + "s," + (i * gl) + "s";
      if(baseOff[i]){
        img.addEventListener("load", function(){
          var h = img.getBoundingClientRect().height || img.clientHeight;
          if(h) img.style.marginBottom = -(baseOff[i] * h) + "px";
        });
      }
      sp.appendChild(img);
      el.appendChild(sp);
    });
  }
  line(document.getElementById("tl0"), EN0, "tword", [0, 0, .213], .10, .47, .33);
  line(document.getElementById("tl1"), EN1, "tword", [0], .34, .53, .41);
  line(document.getElementById("tlcn"), CN, "tchar", [0,0,0,0,0,0,0], .07, .34, .21);
})();

var flEls = [];
PROJECTS.forEach(function(p){

  if(p.kind === "board"){
    node = trayTpl.content.cloneNode(true);

    node.querySelector(".lb").textContent = p.pill;

  var fl = node.querySelector(".fl");

  flEls.push({el:fl, phase:p.phase});
});

/* SECTION: bob & parallax */
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var isMobile = window.matchMedia("(max-width: 900px)").matches;
window.addEventListener("resize", function(){ isMobile = window.matchMedia("(max-width: 900px)").matches; });
var px = 0, py = 0, tx = 0, ty = 0;
if(!reduce && !isMobile){
  window.addEventListener("pointermove", function(e){
    tx = (e.clientX / window.innerWidth - .5) * 18;
    ty = (e.clientY / window.innerHeight - .5) * 12;
  }, {passive:true});
}
function animateFloaters(t){
  if(!reduce && !isMobile){
    px += (tx - px) * .05; py += (ty - py) * .05;
    flEls.forEach(function(f){
      var sp = .8 + (f.phase % 1.8) * .38; /* 每张卡速度略有差异 */
      /* 双频上下起伏：大浪 + 涟漪 */
      var y = Math.sin(t / (860 / sp) + f.phase) * 13 + Math.sin(t / (1900 / sp) + f.phase * 2) * 6;
      /* 左右缓摆 */
      var x = Math.sin(t / (1500 / sp) + f.phase * 1.7) * 10;
      /* 摇头晃脑的旋转 */
      var r = Math.sin(t / (1300 / sp) + f.phase) * 2.4;
      /* 轻微呼吸缩放 */
      var s = 1 + Math.sin(t / (2200 / sp) + f.phase * 1.3) * .012;
      f.el.style.transform = "translate3d(" + (x + px * (f.phase % 2 + .6)).toFixed(2) + "px," + (y + py * (f.phase % 2 + .6)).toFixed(2) + "px,0) rotate(" + r.toFixed(2) + "deg) scale(" + s.toFixed(4) + ")";
    });
  }
  requestAnimationFrame(animateFloaters);
}
requestAnimationFrame(animateFloaters);

var cv = document.getElementById("water");

var ripples = [];
/* 白色噪点纹理（预渲染，用于水面颗粒质感） */
var foamPattern = (function(){
  try{
    var tc = document.createElement("canvas");
    tc.width = 160; tc.height = 160;
    var tctx = tc.getContext("2d");
    var id = tctx.createImageData(160, 160);
    for(var i = 0; i < id.data.length; i += 4){
      var v = Math.random() * 255;
      id.data[i] = 255; id.data[i+1] = 255; id.data[i+2] = 255;
      id.data[i+3] = v > 214 ? Math.floor((v - 214) * 4.5) : 0;
    }
    tctx.putImageData(id, 0, 0);
    return ctx.createPattern(tc, "repeat");
  }catch(e){ return null; }
})();
var DPR = Math.min(window.devicePixelRatio || 1, 2);
function sizeCanvas(){
  if(window.__glOn) return;
  cv.width = Math.floor(window.innerWidth * DPR);
  cv.height = Math.floor(window.innerHeight * DPR);
}
sizeCanvas();
window.addEventListener("resize", sizeCanvas);
window.addEventListener("pointerdown", function(e){
  if(ripples.length < 12) ripples.push({x:e.clientX, y:e.clientY, t:performance.now()});

/* 海洋配色：参考用户提供的青蓝海面图（冰蓝→碧绿→孔雀蓝 + 白色浪花） */
function palette(night){
  return night
    ? {g0:"#16405c", g1:"#0c2a42", g2:"#071c2e", foam:"rgba(210,232,255,", glint:"rgba(150,195,240,", deep:"rgba(2,10,20,"}
    : {g0:"#b9eef1", g1:"#4fc3d9", g2:"#0e72a4", foam:"rgba(255,255,255,", glint:"rgba(255,255,255,", deep:"rgba(6,70,105,"};
}
function drawWaterFull(t){
  var W = window.innerWidth, H = window.innerHeight;
  var night = document.documentElement.dataset.theme === "night";
  var c = palette(night);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  /* 深海基底渐变：远浅近深 */
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, c.g0); g.addColorStop(.42, c.g1); g.addColorStop(1, c.g2);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  /* 天光洒在水面上方 */
  var sg = ctx.createRadialGradient(W*.32, -H*.15, 0, W*.32, -H*.15, H*1.05);
  sg.addColorStop(0, c.glint + (night ? ".07)" : ".20)"));
  sg.addColorStop(1, c.glint + "0)");
  ctx.fillStyle = sg;
  ctx.fillRect(0,0,W,H);

  var i, x;
  function bandWave(baseY, amp, speed, k1, k2, ii){
    return function(xx){
      return baseY
        + Math.sin(xx / k1 + speed * 6.283) * amp
        + Math.sin(xx / k2 - speed * 4.6 + ii) * amp * .42
        + Math.sin(xx / 240 + speed * 2.1) * amp * .5;
    };
  }

  /* 涌浪层：明暗交替的宽厚水体，塑造立体海面 */
  for(i=0;i<6;i++){
    var fr = i/5, ps = Math.pow(fr, 1.6);
    var by = H*(0.14 + 0.80*ps);
    var amp = 5 + 15*ps;
    var sp = t/(4200 - i*300) + i*1.9;
    var wy = bandWave(by, amp, sp, 160 - i*10, 70 - i*4, i);
    var thick = 24 + 66*ps;
    /* 波峰亮带 */
    ctx.beginPath();
    ctx.moveTo(0, wy(0));
    for(x=0;x<=W;x+=20) ctx.lineTo(x, wy(x));
    for(x=W;x>=0;x-=20) ctx.lineTo(x, wy(x) + thick*0.45);
    ctx.closePath();
    ctx.fillStyle = c.foam + (night ? ".035)" : ".07)");
    ctx.fill();
    /* 波谷暗带 */
    ctx.beginPath();
    ctx.moveTo(0, wy(0) + thick*0.45);
    for(x=0;x<=W;x+=20) ctx.lineTo(x, wy(x) + thick*0.45);
    for(x=W;x>=0;x-=20) ctx.lineTo(x, wy(x) + thick);
    ctx.closePath();
    ctx.fillStyle = c.deep + (night ? ".16)" : ".10)");
    ctx.fill();
  }

  /* 浪花脊线：近处带白色辉光，远处细密 */
  for(i=0;i<9;i++){
    var fr2 = i/8, ps2 = Math.pow(fr2, 1.7);
    var by2 = H*(0.10 + 0.86*ps2);
    var amp2 = (3 + 13*ps2) * (night ? .8 : 1);
    var sp2 = t/(3400 - i*180) + i*2.3;
    var wy2 = bandWave(by2, amp2, sp2, 150 - i*8, 64 - i*3, i);
    ctx.beginPath();
    ctx.moveTo(0, wy2(0));
    for(x=0;x<=W;x+=18) ctx.lineTo(x, wy2(x));
    ctx.strokeStyle = c.foam + (night ? ".20" : (.58 - .26*(1-ps2)).toFixed(3)) + ")";
    ctx.lineWidth = 1.4 + 2.8*ps2;
    ctx.lineCap = "round";
    if(i >= 3){
      ctx.shadowColor = "rgba(255,255,255," + (night ? ".14" : ".38") + ")";
      ctx.shadowBlur = 6 + 12*ps2;
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    /* 蕾丝碎泡沫 */
    if(i % 2 === 0){
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, wy2(0) + 5 + 7*ps2);
      for(x=0;x<=W;x+=18) ctx.lineTo(x, wy2(x) + 5 + 7*ps2);
      ctx.setLineDash([3 + 7*ps2, 9 + 13*ps2]);
      ctx.lineDashOffset = -t/(36 - i*2) + i*37;
      ctx.strokeStyle = c.foam + (night ? ".12)" : ".42)");
      ctx.lineWidth = 1 + 2.0*ps2;
      ctx.stroke();
      ctx.restore();
    }
  }

  /* 水面颗粒纹理：缓慢漂移的白色噪点，模拟水体质感 */
  if(foamPattern){
    ctx.save();
    ctx.globalAlpha = night ? .05 : .10;
    var ox = (t*0.012) % 160, oy = (t*0.02) % 160;
    ctx.translate(-ox, -oy);
    ctx.fillStyle = foamPattern;
    ctx.fillRect(0, 0, W + 160, H + 160);
    ctx.restore();
  }

  /* 波光粼粼：闪烁高光点 */
  for(var k=0;k<26;k++){
    var sx = ((k * 137.5) % 100) / 100 * W + Math.sin(t/4200 + k*1.9) * 26;
    var sy = H * (0.15 + ((k * 61.8) % 100) / 100 * 0.8) + Math.cos(t/3600 + k*1.1) * 14;
    var tw = (Math.sin(t / (700 + (k % 5) * 240) + k * 2.7) + 1) / 2;
    var sr = 1 + tw * (1.6 + (sy / H) * 2.2);
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, 6.283);
    ctx.fillStyle = c.glint + (tw * (night ? .30 : .60)).toFixed(3) + ")";
    ctx.fill();
  }

  /* 远处一道宽阔的浪花毯 */
  var farY = H * 0.07 + Math.sin(t/5000) * 4;
  var fg = ctx.createLinearGradient(0, farY - 10, 0, farY + 22);
  fg.addColorStop(0, c.foam + "0)");
  fg.addColorStop(.5, c.foam + (night ? ".12)" : ".46)"));
  fg.addColorStop(1, c.foam + "0)");
  ctx.fillStyle = fg;
  ctx.fillRect(0, farY - 10, W, 32);

  /* 点击涟漪：双圈白色水花 */
  var now = performance.now();
  ripples = ripples.filter(function(r){ return now - r.t < 1800; });
  ripples.forEach(function(r){
    var age = (now - r.t) / 1800;
    for(var n=0;n<2;n++){
      var rad = age * 150 + n * 24;
      var al = (1 - age) * (night ? .3 : .65) * (n ? .55 : 1);
      if(rad > 0 && al > 0){
        ctx.beginPath();
        ctx.arc(r.x, r.y, rad, 0, 6.283);
        ctx.strokeStyle = c.foam + al.toFixed(3) + ")";
        ctx.lineWidth = 1.8;
        ctx.stroke();
      }
    }
  });
}

/* SECTION: photo ocean —— 真实海面照片 + 动态光效叠加（不依赖 WebGL，任何浏览器稳定呈现） */
var seaImg = document.getElementById("seaImg");
var photoOK = false;
seaImg.addEventListener("load", function(){ photoOK = true; });
seaImg.addEventListener("error", function(){ photoOK = false; });
seaImg.src = seaImg.dataset.image;

function drawOverlay(t){
  var W = window.innerWidth, H = window.innerHeight;
  var night = document.documentElement.dataset.theme === "night";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  var foam = night ? "rgba(200,225,255," : "rgba(255,255,255,";
  var i, x;
  /* 1. 漂动的柔光波带：更厚更亮，让照片海面产生流动感 */
  for(i=0;i<6;i++){
    var ps = i/5;
    var by = H*(0.55 + 0.38*Math.pow(ps,1.2));
    var amp = 6 + 16*ps;
    var sp = t/(5200 - i*400) + i*2.1;
    ctx.beginPath();
    ctx.moveTo(0, by);
    for(x=0;x<=W;x+=22){
      ctx.lineTo(x, by + Math.sin(x/(170-i*14) + sp*6.283)*amp + Math.sin(x/73 - sp*4.3 + i)*amp*0.35);
    }
    var bot = by + 34 + 70*ps;
    ctx.lineTo(W, bot);
    for(x=W;x>=0;x-=22){
      ctx.lineTo(x, bot + Math.sin(x/(190-i*12) - sp*5.1)*amp*0.8);
    }
    ctx.closePath();
    ctx.fillStyle = foam + (night ? ".045" : ".07") + ")";
    ctx.fill();
  }
  ctx.save();
  ctx.globalCompositeOperation = "lighter"; /* 加色混合：光效叠在照片上更透亮 */
  /* 2. 阳光波光带：沿照片右侧亮区铺一条随波闪动的碎光毯 */
  var sunX = W*0.68, spread = W*0.15;
  for(i=0;i<80;i++){
    var sd = i*1.618;
    var drift = Math.sin(t/2600 + sd)*W*0.02;
    var gx = sunX + Math.sin(sd)*spread + drift;
    var gy = H*(0.55 + ((i*0.618)%1)*0.42) + Math.cos(t/2100 + sd)*10;
    var off = Math.abs(gx - sunX - drift*0.5)/spread;
    var core = Math.max(0, 1 - off);
    var tw = (Math.sin(t/(320 + (i%7)*90) + i*2.7)+1)/2;
    var a = tw * core * (night ? .20 : .42);
    if(a > .01){
      var rw = 1 + tw*(2.2 + (gy/H)*3.2);
      var rh = rw * 0.6;
      ctx.beginPath();
      ctx.ellipse(gx, gy, rw, rh, 0, 0, 6.283);
      ctx.fillStyle = foam + a.toFixed(3) + ")";
      ctx.fill();
    }
  }
  /* 3. 全域波光粼粼：更多更亮的闪烁点，高峰时带十字星芒 */
  for(var k=0;k<46;k++){
    var sx = ((k*137.5)%100)/100*W + Math.sin(t/4200+k*1.9)*30;
    var sy = H*(0.10+((k*61.8)%100)/100*0.86) + Math.cos(t/3600+k*1.1)*16;
    var twk = Math.pow((Math.sin(t/(560+(k%6)*210)+k*2.7)+1)/2, 1.6);
    var sr = 0.7 + twk*(1.8+(sy/H)*2.8);
    ctx.beginPath();
    ctx.arc(sx,sy,sr,0,6.283);
    ctx.fillStyle = foam + (twk*(night?.45:.75)).toFixed(3) + ")";
    ctx.fill();
    if(twk > .8){
      var l = sr*3.2, ma = (twk-.8)*(night?3:4);
      ctx.strokeStyle = foam + (ma > 1 ? 1 : ma).toFixed(3) + ")";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx-l, sy); ctx.lineTo(sx+l, sy);
      ctx.moveTo(sx, sy-l*.7); ctx.lineTo(sx, sy+l*.7);
      ctx.stroke();
    }
  }
  /* 4. 缓慢扫过海面的宽光束 */
  for(i=0;i<2;i++){
    var bx = (((t/(26000+i*11000) + i*0.37)%1.4) - 0.2)*W*1.4;
    var lg = ctx.createLinearGradient(bx - W*0.20, 0, bx + W*0.20, H);
    lg.addColorStop(0, foam + "0)");
    lg.addColorStop(.5, foam + (night?".05":".10") + ")");
    lg.addColorStop(1, foam + "0)");
    ctx.fillStyle = lg;
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
  /* 5. 缓慢漂移的水面颗粒纹理 */
  if(foamPattern){
    ctx.save();
    ctx.globalAlpha = night ? .04 : .06;
    ctx.translate(-(t*0.014)%160, -(t*0.022)%160);
    ctx.fillStyle = foamPattern;
    ctx.fillRect(0,0,W+160,H+160);
    ctx.restore();
  }
  /* 6. 点击涟漪 */
  var now = performance.now();
  ripples = ripples.filter(function(r){ return now - r.t < 1800; });
  ripples.forEach(function(r){
    var age = (now - r.t)/1800;
    for(var n=0;n<2;n++){
      var rad = age*150 + n*24;
      var al = (1-age)*(night?.34:.7)*(n?.55:1);
      if(rad>0 && al>0){
        ctx.beginPath();
        ctx.arc(r.x,r.y,rad,0,6.283);
        ctx.strokeStyle = foam + al.toFixed(3) + ")";
        ctx.lineWidth = 1.8;
        ctx.stroke();
      }
    }
  });
}

function waterLoop(t){
  if(photoOK){ drawOverlay(t); } else { drawWaterFull(t); }
  requestAnimationFrame(waterLoop);
}

/* SECTION: card modal */
var modal = document.getElementById("modal");
var modalPanel = document.getElementById("modalPanel");
var mTitle = document.getElementById("mTitle");
var mFacts = document.getElementById("mFacts");
var mText = document.getElementById("mText");
var mTools = document.getElementById("mTools");
var mStatic = document.getElementById("mStatic");
var board = document.getElementById("board");
var mCard = document.getElementById("mCard");
var lastFrom = null; /* FLIP：记录打开时点击的卡片，关闭时缩回去 */

function chip(cls, txt){
  var s = document.createElement("span");
  s.className = cls;
  s.textContent = txt;
  return s;
}
function openCard(p, fromEl){
  mTitle.textContent = p.title;
  mFacts.textContent = "";
  p.facts.forEach(function(f, i){ mFacts.appendChild(chip("fact" + (i === 0 ? " acc" : ""), f)); });
  mText.textContent = p.text;
  mTools.textContent = "";
  (p.tools || []).forEach(function(t){ mTools.appendChild(chip("tool", t)); });
  mTools.style.display = (p.tools && p.tools.length) ? "flex" : "none";
  lastFrom = fromEl || null;
  if(p.kind === "static"){
    mStatic.style.display = "block";
    board.style.display = "none";
    mStatic.textContent = "";
    mStatic.appendChild(document.getElementById(p.tpl).content.cloneNode(true));
  }else{
    mStatic.style.display = "none";
    board.style.display = "block";
    board.textContent = "";
    p.tiles.forEach(function(url){
      var img = document.createElement("img");
      img.dataset.image = url;
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.alt = p.title + " 设计稿";
      img.addEventListener("load", function(){ img.dataset.loaded = "1"; img.dataset.ok = "1"; markTile(img); });
      img.addEventListener("error", function(){ replaceWithFail(img, url); });
      img.addEventListener("click", function(){ if(img.dataset.ok){ openLightbox(url); } });
      img.src = img.dataset.image;
      board.appendChild(img);
      setTimeout(function(){
        if(!img.dataset.ok && img.parentNode){ replaceWithFail(img, url); }
      }, 12000);
    });
    /* 滚动到视野内且加载完成后依次浮现 */
    if("IntersectionObserver" in window){
      if(boardIO) boardIO.disconnect();
      boardIO = new IntersectionObserver(function(ents){
        ents.forEach(function(en){
          if(en.isIntersecting){
            en.target.dataset.seen = "1";
            markTile(en.target);
            boardIO.unobserve(en.target);
          }
        });
      }, {root: modalPanel, rootMargin: "120px 0px", threshold: 0.01});
      board.querySelectorAll("img").forEach(function(im){ boardIO.observe(im); });
    }else{
      board.querySelectorAll("img").forEach(function(im){ im.classList.add("in"); });
    }
    /* 兜底：4 秒后全部显示，避免异常环境下内容不可见 */
    setTimeout(function(){
      board.querySelectorAll("img").forEach(function(im){ im.classList.add("in"); });
    }, 4000);
  }
  modal.classList.remove("closing", "mask-in");
  modal.classList.add("open");
  modalPanel.scrollTop = 0;
  document.body.style.overflow = "hidden";
  /* FLIP：卡片从点击处放大展开（kiabai.me 风格） */
  if(fromEl && !reduce){
    var fr = fromEl.getBoundingClientRect();
    mCard.classList.remove("flip");
    var cr = mCard.getBoundingClientRect();
    var sx = Math.max(fr.width / cr.width, .04);
    var sy = Math.max(fr.height / cr.height, .04);
    var dx = fr.left + fr.width / 2 - (cr.left + cr.width * sx / 2);
    var dy = fr.top + fr.height / 2 - (cr.top + cr.height * sy / 2);
    mCard.style.transformOrigin = "top left";
    mCard.style.transform = "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px) scale(" + sx.toFixed(4) + "," + sy.toFixed(4) + ")";
    mCard.style.opacity = "0";
    void mCard.offsetWidth;
    mCard.classList.add("flip");
    requestAnimationFrame(function(){
      mCard.style.transform = "";
      mCard.style.opacity = "";
      modal.classList.add("mask-in");
    });
  }else{
    modal.classList.add("mask-in");
  }
}
var boardIO = null;
function markTile(img){
  if(img.dataset.seen && img.dataset.loaded) img.classList.add("in");
  else if(!("IntersectionObserver" in window) && img.dataset.loaded) img.classList.add("in");
}
function replaceWithFail(img, url){
  if(!img.parentNode) return;
  var fail = document.createElement("div");
  fail.className = "tile-fail";
  fail.style.display = "block";
  var txt = document.createElement("span");
  txt.textContent = "该段设计稿加载失败。";
  var link = document.createElement("a");
  link.textContent = "点击在新窗口查看原图";
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener";
  link.referrerPolicy = "no-referrer";
  link.style.cssText = "color:#007AFF;font-weight:600;margin-left:6px";
  fail.appendChild(txt);
  fail.appendChild(link);
  img.replaceWith(fail);
}
function closeModal(){
  if(!modal.classList.contains("open") || modal.classList.contains("closing")) return;
  /* FLIP 反向：卡片缩回点击处 */
  if(lastFrom && !reduce){
    modal.classList.add("closing");
    modal.classList.remove("mask-in");
    mCard.classList.add("flip");
    var fr = lastFrom.getBoundingClientRect();
    var cr = mCard.getBoundingClientRect();
    var sx = Math.max(fr.width / cr.width, .04);
    var sy = Math.max(fr.height / cr.height, .04);
    var dx = fr.left + fr.width / 2 - (cr.left + cr.width * sx / 2);
    var dy = fr.top + fr.height / 2 - (cr.top + cr.height * sy / 2);
    mCard.style.transformOrigin = "top left";
    mCard.style.transform = "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px) scale(" + sx.toFixed(4) + "," + sy.toFixed(4) + ")";
    mCard.style.opacity = "0";
    setTimeout(actuallyClose, 420);
  }else{
    actuallyClose();
  }
}
function actuallyClose(){
  modal.classList.remove("open", "closing", "mask-in");
  mCard.classList.remove("flip");
  mCard.style.transform = "";
  mCard.style.opacity = "";
  document.body.style.overflow = "";
}
document.getElementById("mClose").addEventListener("click", closeModal);
document.getElementById("modalMask").addEventListener("click", closeModal);

  e.preventDefault();
  openLightbox(RESUME_PNG);
});

/* SECTION: lightbox */
var lightbox = document.getElementById("lightbox");
var lightboxImg = document.getElementById("lightboxImg");
function openLightbox(url){
  lightboxImg.src = url;
  lightbox.classList.add("open");
  lightbox.classList.remove("tall");
  lightbox.scrollTop = 0;
  function check(){
    if(lightboxImg.naturalWidth && lightboxImg.naturalHeight / lightboxImg.naturalWidth > 1.6){
      lightbox.classList.add("tall"); /* 长图：按原始比例滚动浏览 */
      lightbox.scrollTop = 0;
    }
  }
  if(lightboxImg.complete && lightboxImg.naturalWidth) check();
  else lightboxImg.addEventListener("load", check, {once:true});
}
function closeLightbox(){
  lightbox.classList.remove("open", "tall");
  lightboxImg.removeAttribute("src");
}
lightbox.addEventListener("click", closeLightbox);
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(lightbox.classList.contains("open")){
      closeLightbox();
    }else if(modal.classList.contains("open")){
      closeModal();
    }
  }
});
